{% extends 'base.html' %}
{% block title %}Password updated — FixIt Pro{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><i class="bi bi-check-circle"></i></div>
    <div class="text-center mb-4">
      <h4 class="mb-1">Password updated</h4>
      <p class="text-muted small">Your password has been changed.</p>
    </div>
    <a href="{% url 'login' %}" class="btn btn-amber w-100 py-2"><i class="bi bi-box-arrow-in-right me-2"></i>Sign in</a>
  </div>
</div>
{% endblock %}
